# Domain of a link -> codebook category (codebook v2.1), for links in Wikipedia
# references (hypothesis H2, docs/hipotezy.md). A domain matches itself and its
# subdomains, and the longest matching entry wins (ncbi.nlm.nih.gov before
# nih.gov, szczepienia.pzh.gov.pl before gov.pl). Domains not listed stay
# `unclassified`; every domain is reviewed by hand before the confirmatory run
# (annotations/hypotheses/domain_review.csv).
#
# As in the codebook: ministries, offices and law are `other`; public health,
# statistical and research bodies are `institutional`; code and data hosting
# (GitHub, GitLab) is `other`, not a blog or social medium.

