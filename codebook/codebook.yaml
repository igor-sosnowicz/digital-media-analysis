# Codebook: powoływanie się na źródła informacji (Reddit i Wikipedia).
# Jedno źródło prawdy dla annotatorów i instrumentów. Czytelną wersję
# codebook/codebook.md generuje `make codebook`; nie edytuj jej ręcznie.
# Kody (zmienne, kategorie, kolumny) są po angielsku; nazwy i definicje po polsku.

title: Powoływanie się na źródła informacji
version: "2.2"
date: 2026-10-25
status: wersja robocza przed pilotażem annotacji

construct: >-
  Powołanie się na źródło to wskazanie przez autora, skąd pochodzi
  informacja albo na czym opiera on twierdzenie: link, nazwa źródła,
  ogólnikowe odwołanie („badania pokazują”) albo jawnie przywołane
  doświadczenie własne lub cudze. Kodujemy typ źródła, nie jego wiarygodność
  ani to, czy autor z nim się zgadza.

units:
  - platform: reddit
    unit: post
    text: tytuł, treść i link posta (kolumny `title`, `text` i `url`)
    note: >-
      Pole `url` liczy się tylko wtedy, gdy prowadzi poza własny wątek
      posta (post z linkiem). Komentarzy pod postem nie ma w danych. Nie
      otwieramy linków: kategorię ustalamy z domeny i otaczającego tekstu.
  - platform: wikipedia
    unit: opis zmiany jednej rewizji
    text: pole `comment` rewizji
    note: >-
      To krótki opis edycji wpisany przez redaktora albo wygenerowany przez
      narzędzie, a nie treść artykułu ani strona dyskusji.

variables:
  - code: source_types
    name: Typy źródeł
    type: multilabel
    platforms: [reddit, wikipedia]
    question: >-
      Jakiego typu źródła przywołuje autor? Zaznacz wszystkie występujące
      albo wpisz `none`, gdy jednostka nie zawiera powołania.
  - code: cites_source
    name: Powołanie się na źródło
    type: binary
    platforms: [reddit, wikipedia]
    question: Czy autor wskazuje, skąd pochodzi informacja lub na czym opiera twierdzenie?
    derived: "z `source_types`: 0, gdy `source_types = none`, w przeciwnym razie 1; nie wypełniamy jej w arkuszu (R13)"
    values:
      "1": jest co najmniej jedno powołanie zgodne z definicją konstruktu i regułami
      "0": brak powołania, także gdy występują tylko linki lub nazwy niebędące źródłem (R2, R3, R8, R9)
  - code: edit_about_sources
    name: Edycja dotyczy źródeł lub przypisów
    type: binary
    platforms: [wikipedia]
    question: Czy opis zmiany deklaruje dodanie, usunięcie, wymianę lub poprawę źródeł albo przypisów?
    values:
      "1": opis deklaruje pracę nad źródłami lub przypisami (w tym znacznik „źródła/przypisy”)
      "0": brak takiej deklaracji; sam prefiks sekcji `/* Przypisy */` się nie liczy (R9)
  - code: consensus_stance
    name: Stanowisko wobec konsensusu naukowego
    type: nominal
    platforms: [reddit]
    question: >-
      Jaki stosunek do nauki, naukowców lub konsensusu naukowego wyraża autor
      posta (tytułem, treścią albo sposobem przedstawienia linkowanego materiału)?
    values:
      supports: >-
        autor ufa nauce lub naukowcom, broni ustaleń naukowych albo przedstawia
        je jako wiarygodne, także kpiąc z pseudonauki (R14)
      challenges: >-
        autor podważa konsensus naukowy, wyraża nieufność wobec naukowców lub
        instytucji naukowych albo promuje twierdzenie sprzeczne z ustaleniami
        nauki (np. „szczepionki powodują autyzm”, „ocieplenie to oszustwo”)
      neutral: >-
        post dotyczy nauki, naukowców lub twierdzenia naukowego, ale autor nie
        zajmuje stanowiska (samo przekazanie wiadomości, pytanie)
      not_applicable: >-
        post nie dotyczy nauki, naukowców ani twierdzeń naukowych

  - code: consensus_topic
    name: Temat konsensusu naukowego
    type: nominal
    platforms: [reddit]
    question: >-
      Którego z tematów konsensusu naukowego dotyczy post albo komentarz
      (wybierz główny, gdy jest kilka)?
    values:
      climate: >-
        zmiana klimatu: ocieplenie i jego przyczyny, gazy cieplarniane, IPCC
      vaccines: >-
        szczepionki: bezpieczeństwo, skuteczność, autyzm, ruch antyszczepionkowy
      evolution: >-
        ewolucja: dobór naturalny, pochodzenie człowieka, kreacjonizm
      gmo: >-
        żywność modyfikowana genetycznie: bezpieczeństwo, uprawy GM, Monsanto
      fluoride: >-
        fluoryzacja wody pitnej
      none: >-
        jednostka nie dotyczy żadnego z tych tematów, także gdy dotyczy innej
        nauki

categories:
  - code: scientific
    name: Publikacje naukowe
    definition: >-
      Konkretne publikacje naukowe: artykuły w czasopismach, preprinty,
      monografie, podręczniki akademickie i raporty badawcze (np. Nature,
      PubMed, Science).
    include:
      - doi.org, pubmed, nature.com, science.org, arxiv.org, repozytoria publikacji (academia.edu), biblioteki cyfrowe
      - tytuł lub cytat konkretnej publikacji, czasopismo jako źródło („według badania w The Lancet”)
      - „źródło uniwersyteckie” w opisie edycji
    exclude:
      - instytucja naukowa lub statystyczna bez wskazania publikacji („dane GUS”, „według WHO”; wtedy `institutional`)
      - własne badanie autora, np. rekrutacja do ankiety (R8)
      - osobista wizyta u lekarza (wtedy `personal`)
      - ogólnik bez wskazania badania („badania pokazują”; wtedy `unknown`)
    positive:
      - platform: wikipedia
        text: Cytat z publikacji o wprowadzeniu do medycyny wraz z linkiem do PDF w bibliotece cyfrowej.
      - platform: reddit
        text: "Konstruowany: tytuł badania jako tytuł posta i link do artykułu w nature.com."
    negative:
      - platform: reddit
        text: Studentka zbiera odpowiedzi do ankiety do pracy dyplomowej i podaje link do formularza.
        why: To własne badanie autorki, nie powołanie się na badania (R8).
      - platform: reddit
        text: Opis wielu lat problemów zdrowotnych; „ostatni lekarz umocnił moje przypuszczenia”.
        why: To relacja z osobistej konsultacji, więc `personal`, a nie publikacja.

  - code: institutional
    name: Instytucje naukowe i statystyczne
    definition: >-
      Instytucje, które wytwarzają lub udostępniają wiedzę naukową, dane
      statystyczne i zalecenia zdrowotne, gdy źródłem jest instytucja, a nie
      konkretna publikacja: urzędy statystyczne (GUS, Eurostat), organizacje i
      agencje zdrowia publicznego (WHO, ECDC, CDC, PZH), uczelnie, instytuty
      badawcze i ośrodki badania opinii.
    include:
      - link do who.int, ecdc.europa.eu, stat.gov.pl, aids.gov.pl albo strony uczelni lub instytutu
      - „według GUS”, „dane WHO”, „zalecenia ECDC”
      - nazwany sondaż lub ośrodek badawczy („sondaż IBRiS”), tabela wyników sondaży
    exclude:
      - urzędy i administracja publiczna, ministerstwa, samorządy, policja, sądy, parlament i akty prawne (wtedy `other`)
      - konkretna publikacja naukowa (wtedy `scientific`)
      - instytucja jako uczestnik zdarzenia, np. „WHO ogłosiło pandemię” w artykule portalu (liczy się wydawca; R4)
    positive:
      - platform: wikipedia
        text: Usunięcie synonimów, bo „według tego źródła” nimi nie są, z linkiem do aids.gov.pl.
      - platform: wikipedia
        text: Objawy uzupełnione „według WHO”, z linkiem do strony pytań i odpowiedzi WHO.
      - platform: reddit
        text: Tabela ostatnich sondaży partyjnych z nazwami sondażowni, terminami i wielkością próby.
    negative:
      - platform: reddit
        text: Zbiórka pomocy w odnalezieniu bliskiej osoby; w tekście słowo „bogusiem”.
        why: Nie ma żadnej instytucji. Ciąg „gus” jest tylko fragmentem imienia.
      - platform: reddit
        text: "Konstruowany: „Według komunikatu urzędu miasta tramwaje nie jeżdżą do niedzieli”."
        why: Urząd miasta to administracja, a nie instytucja naukowa ani statystyczna, więc `other`.

  - code: media
    name: Media informacyjne
    definition: >-
      Portale, gazety, telewizja, radio, agencje prasowe i magazyny
      publicystyczne (np. BBC, Reuters, Onet, WP).
    include:
      - link do artykułu lub materiału redakcji (wp.pl, onet.pl, gazeta.pl, money.pl, bbc.com, reuters.com)
      - nazwa redakcji jako źródła („jak podaje TVN24”)
      - porady językowe publikowane w prasie
    exclude:
      - media jako temat lub uczestnik zdarzenia („TVP zwolniła dziennikarza”)
      - konto redakcji w serwisie społecznościowym bez linku do materiału redakcji (wtedy `social_blog`)
      - blog prywatny lub na platformie blogowej (wtedy `social_blog`)
    positive:
      - platform: reddit
        text: Tytuł artykułu o wecie prezydenta i link do wiadomosci.gazeta.pl jako cała treść posta.
      - platform: reddit
        text: Post o tym, że ZUS konfiskuje oszczędności, z linkiem do wp.pl (ZUS jest tematem, wydawcą jest wp.pl; R4).
      - platform: wikipedia
        text: Poprawa błędu językowego, „por. np.” i link do felietonu w gazetawroclawska.pl.
    negative:
      - platform: reddit
        text: "Konstruowany: „TVP zwolniła dziennikarza, co o tym myślicie?” bez linku i bez powołania się na relację mediów."
        why: Medium jest tematem posta, a nie źródłem informacji (R2).

  - code: personal
    name: Doświadczenia własne
    definition: >-
      Autor opiera twierdzenie na własnym doświadczeniu albo na relacji
      konkretnej osoby z otoczenia, w tym specjalisty spotkanego osobiście
      („Z własnego doświadczenia powiem, że…”).
    include:
      - „z własnego doświadczenia”, „u mnie w pracy zawsze…” użyte jako dowód twierdzenia
      - „znajomy pracuje w szpitalu i mówi, że…”, „lekarz powiedział mi, że…”
      - kontakt z urzędem opisany jako własne przeżycie
    exclude:
      - opis sytuacji bez funkcji dowodu („mieszkam w centrum, można odebrać”)
      - osoby jako uczestnicy, np. szukanie znajomych czy prezent dla znajomego
      - własna opinia („według mnie”, „moim zdaniem”; R8)
    positive:
      - platform: reddit
        text: Opis wielu lat problemów zdrowotnych; „ostatni lekarz umocnił moje przypuszczenia”.
    negative:
      - platform: reddit
        text: Para szuka znajomych do wspólnego wychodzenia.
        why: „znajomych” to cel posta, a nie źródło informacji.
      - platform: reddit
        text: „Mieszkam na wsi” i pytanie o lepszego dostawcę internetu.
        why: Miejsce zamieszkania jest kontekstem, a nie dowodem.

  - code: social_blog
    name: Media społecznościowe, blogi
    definition: >-
      Serwisy społecznościowe i platformy treści użytkowników (Reddit,
      YouTube, Facebook, X/Twitter, TikTok, Instagram, Wykop, fora) oraz
      blogi, w tym prywatne i hobbystyczne.
    include:
      - link do filmu, wpisu lub wątku udostępnionego jako informacja
      - „widziałem na Twitterze, że…”, wpis polityka w serwisie społecznościowym
      - link do bloga użytego jako źródło informacji
    exclude:
      - zdjęcia i filmy autora hostowane przez platformę (i.redd.it, preview.redd.it, v.redd.it, imgur; R3)
      - nazwa serwisu w innym znaczeniu, np. kod rabatowy „reddit100”
      - blog redakcji medium informacyjnego (wtedy `media`)
    positive:
      - platform: reddit
        text: Post z okazji rocznicy zaprzysiężenia prezydenta z linkiem do filmu na YouTube jako materiałem do dyskusji.
      - platform: reddit
        text: "Konstruowany: „Trasę opisał autor bloga rowerowego X, tam są też wysokości przewyższeń” z linkiem do bloga."
    negative:
      - platform: reddit
        text: Reklama perfumerii, której treścią jest tylko zdjęcie z preview.redd.it.
        why: Zdjęcie jest własną treścią autora, a nie źródłem (R3).

  - code: encyclopedia
    name: Encyklopedie, słowniki
    definition: >-
      Encyklopedie (w tym artykuły Wikipedii i Britannica), słowniki (np.
      Słownik Języka Polskiego, sjp.pl), poradnie językowe słowników i bazy
      wiedzy.
    include:
      - link do artykułu Wikipedii, Wikidata, Britannica, IMDb
      - sjp.pl, sjp.pwn.pl i poradnia językowa PWN
      - linki objaśniające nazwy, np. nazwa partii podlinkowana do Wikipedii
    exclude:
      - skróty zasad i narzędzi Wikipedii w opisach edycji (`[[WP:SK]]`, `[[WP:POP]]`, `[[Pomoc:…]]`; R9)
    positive:
      - platform: wikipedia
        text: „Brzydki rusycyzm” i link do poradni językowej sjp.pwn.pl.
      - platform: reddit
        text: Nazwy partii w tabeli sondaży podlinkowane do artykułów angielskiej Wikipedii.
    negative:
      - platform: wikipedia
        text: "`[[WP:SK]], drobne techniczne`"
        why: To odnośnik do narzędzia porządkowania kodu (skrypt WP:SK), a nie źródło informacji (R9).

  - code: other
    name: Inne źródła
    definition: >-
      Źródło dające się zidentyfikować (nazwa lub link), które nie pasuje do
      pozostałych kategorii: sklepy, producenci i strony firm, urzędy i
      administracja publiczna (ministerstwa, samorządy, policja, sądy,
      parlament, akty prawne), organizacje pozarządowe, społeczne i polityczne
      oraz inne strony.
    include:
      - „według strony producenta rama waży 1,2 kg”, link do oferty jako dowód ceny lub dostępności
      - link do gov.pl lub strony urzędu, „komunikat policji”, treść ustawy
      - link do strony fundacji, NGO lub partii (wwf.pl, greenpeace.org), „raport fundacji X”
    exclude:
      - źródło pasujące do innej kategorii; `other` stosujemy tylko w ostateczności (R7)
      - serwis lub strona jako miejsce poszukiwań albo przedmiot rozmowy (R2)
      - reklama, link afiliacyjny, spam, kod rabatowy (R3)
      - instytucja lub sklep jako uczestnik albo miejsce zdarzenia („Sejm uchwalił ustawę”, „sklepy zamykały rolety”)
    positive:
      - platform: reddit
        text: "Konstruowany: „Na Allegro ten model kosztuje 300 zł, więc 500 zł to przesada” z linkiem do oferty."
      - platform: wikipedia
        text: Link do strony WWF o klimacie z dopiskiem „inspiracja”.
      - platform: reddit
        text: "Konstruowany: „Według komunikatu urzędu miasta tramwaje nie jeżdżą do niedzieli”."
    negative:
      - platform: reddit
        text: Pytanie po angielsku, czy poza OLX i Otodom są inne serwisy z mieszkaniami na krótki termin.
        why: Serwisy są przedmiotem pytania, a nie źródłem informacji (R2).
      - platform: reddit
        text: Post kasyna online o bonusie powitalnym; link posta prowadzi do serwisu z promocjami hazardowymi.
        why: Reklama lub spam (R3).
      - platform: reddit
        text: Pytanie o aplikacje do „zbierania kwadratów” z linkami do ich stron głównych.
        why: Linki wskazują przedmiot rozmowy, a nie źródło informacji (R2).
      - platform: reddit
        text: Post o rozłamie w partii z linkiem do artykułu wprost.pl.
        why: Partia jest tematem, a wydawcą jest medium, więc `media` (R4).

  - code: unknown
    name: Nieokreślone
    definition: >-
      Autor odwołuje się do źródła, którego nie da się zidentyfikować
      („Badania pokazują, że…”, „czytałem gdzieś”, „według ekspertów”, „wg źródła”).
    include:
      - „takie badania zostały przeprowadzone” bez wskazania których
      - „wg źródła” w opisie edycji bez nazwy lub linku
    exclude:
      - sam znacznik „źródła/przypisy” lub „dodano przypis” w opisie edycji (to `edit_about_sources`; R10)
      - słowo „link” lub „artykuł” w innym znaczeniu („podeślijcie link partnerkom”, „poprawiam link”)
      - własna opinia („według mnie”; R8)
    positive:
      - platform: wikipedia
        text: Uwaga, że takie badania przeprowadzono, a korzyści leku są dyskusyjne; bez wskazania badań.
      - platform: wikipedia
        text: "„wg źródła jeszcze kapusta”"
    negative:
      - platform: wikipedia
        text: "„drobne redakcyjne, źródła/przypisy”"
        why: To znacznik typu edycji, a nie powołanie, więc edit_about_sources = 1 i source_types = none (R10).
      - platform: wikipedia
        text: "Bot: „poprawiam link tożsamy z tekstem linka”"
        why: Słowo „link” oznacza tu element techniczny strony.

  - code: none
    name: Brak
    definition: >-
      Brak odwołania do źródła: jednostka nie zawiera żadnego powołania
      zgodnego z definicją konstruktu i regułami. Kod `none` wpisujemy sam,
      bez innych kodów (R13).
    include:
      - tekst bez linków, nazw źródeł i odwołań
      - linki i nazwy, które nie pełnią funkcji źródła (R2, R3, R8, R9), np. własne zdjęcie z i.redd.it
      - opis edycji z samym znacznikiem „źródła/przypisy” (R10)
    exclude:
      - jakiekolwiek rozpoznane powołanie, także ogólnikowe (wtedy jego kategoria albo `unknown`)
    positive:
      - platform: reddit
        text: Para szuka znajomych do wspólnego wychodzenia.
      - platform: wikipedia
        text: "`[[WP:SK]], drobne techniczne`"
    negative:
      - platform: wikipedia
        text: "„wg źródła jeszcze kapusta”"
        why: To ogólnikowe powołanie, więc `unknown`, a nie `none` (R5).

rules:
  - code: R1
    text: >-
      Etykietujemy całą jednostkę: post (tytuł, treść i link) albo opis zmiany.
      Przy `source_types` zaznacz każdą kategorię, która wystąpiła choć raz;
      liczba wystąpień nie ma znaczenia.
  - code: R2
    text: >-
      Powołanie wymaga funkcji źródła: tekst lub link musi wskazywać, skąd
      pochodzi informacja, albo podawać ją jako podstawę twierdzenia. Sama
      wzmianka o instytucji, osobie lub serwisie jako uczestniku zdarzenia
      albo przedmiocie rozmowy to nie powołanie.
  - code: R3
    text: >-
      Nie są źródłem: własne zdjęcia i filmy hostowane przez platformę
      (i.redd.it, preview.redd.it, v.redd.it, imgur), formularze ankiet,
      reklamy, linki afiliacyjne, spam, kody rabatowe i linki do profili
      użytkowników.
  - code: R4
    text: >-
      Kategorię wyznacza wydawca lub kanał, z którego pochodzi informacja,
      a nie temat ani osoby opisane w materiale. Artykuł wp.pl o decyzji
      ministerstwa to `media`. Gdy autor wymienia też źródło pierwotne
      przywołane w materiale („onet, powołując się na raport GUS”),
      zaznacz obie kategorie.
  - code: R5
    text: >-
      Konkret wygrywa z ogólnikiem. `unknown` zaznaczamy tylko wtedy, gdy
      jakieś odwołanie w jednostce pozostaje nierozpoznawalne. Jeśli ten sam
      fragment wskazuje konkretne źródło, kodujemy jego kategorię.
  - code: R6
    text: >-
      Nie oceniamy wiarygodności. Tekst pseudonaukowy w repozytorium
      publikacji to nadal `scientific`, a artykuł z portalu o niskiej
      wiarygodności to nadal `media`.
  - code: R7
    text: >-
      Kategoria `other` jest ostatecznością. Gdy domena jest nieznana, można
      sprawdzić, kto ją prowadzi, ale nie kodujemy treści strony docelowej.
  - code: R8
    text: >-
      Nie są powołaniem: własna opinia („według mnie”, „moim zdaniem”),
      prośba o źródło („macie jakieś dane?”) ani własne badanie autora
      (rekrutacja do ankiety).
  - code: R9
    text: >-
      Wikipedia, elementy techniczne. Pomijamy automatyczny prefiks sekcji
      `/* … */`. Skróty zasad i narzędzi (`[[WP:…]]`, `[[Pomoc:…]]`), opisy
      redakcyjne („drobne redakcyjne”, „int.”, „kat.”), komunikaty botów i
      rewerty („Wycofano edycje użytkownika…”, „Anulowanie wersji…”) nie są
      źródłem.
  - code: R10
    text: >-
      Wikipedia, praca nad przypisami. Deklaracja pracy nad źródłami
      (znacznik „źródła/przypisy”, „dodano przypis”, poprawa przypisów) daje
      `edit_about_sources = 1`. Kategorię źródła zamiast `none` dajemy tylko
      wtedy, gdy opis identyfikuje źródło albo jego typ („wg WHO”, „źródło
      uniwersyteckie”).
  - code: R11
    text: Wpisy po angielsku i w innych językach kodujemy według tych samych reguł.
  - code: R12
    text: >-
      W razie wątpliwości wybierz najlepszą etykietę, ustaw `uncertain = 1`
      i opisz problem w `notes`. Takie przypadki omawiamy przy uzgadnianiu
      etykiet i mogą one zmienić codebook.
  - code: R13
    text: >-
      `source_types` wypełniamy zawsze. `none` wpisujemy wtedy i tylko wtedy,
      gdy jednostka nie zawiera żadnego powołania, i nie łączymy go z innymi
      kodami. `cites_source` nie jest kodowane w arkuszu: wynosi 0 przy
      `none` i 1 przy każdej innej etykiecie.
  - code: R14
    text: >-
      `consensus_stance` kodujemy tylko na Reddicie, w osobnym arkuszu
      stanowiska (`stance_*.xlsx`). Podstawą jest to, co autor pisze sam albo
      jak przedstawia linkowany materiał w tytule; nie otwieramy linków i nie
      oceniamy, kto ma rację (R6). Artykuł o badaniu udostępniony bez
      komentarza to `neutral`. Ironia lub kpina wobec naukowców albo nauki to
      `challenges`, a kpina z pseudonauki (typowa dla r/skeptic) to `supports`.
      Post bez związku z nauką (polityka, technologia, rozrywka bez twierdzeń
      naukowych) to `not_applicable`.
  - code: R15
    text: >-
      `consensus_topic` kodujemy w arkuszu walidacyjnym H1 v2 razem z
      `consensus_stance`, dla postów i komentarzy. Temat to ten, którego
      dotyczy twierdzenie jednostki, a nie samo użyte słowo: „evolution of
      smartphones” to `none`. Stanowisko oceniamy wtedy względem konsensusu
      tego tematu (codebook/topics.yaml): komentarz „vaccines cause autism” to
      `vaccines` i `challenges`, nawet bez słowa o naukowcach.

annotation_columns:
  - name: unit_id
    description: identyfikator jednostki (Reddit `id` posta; Wikipedia `strona#numer_rewizji`)
  - name: annotator
    description: inicjały osoby annotującej
  - name: source_types
    description: kody kategorii rozdzielone średnikiem, np. `media;scientific`; `none`, gdy nie ma powołania (R13)
  - name: edit_about_sources
    description: 0 lub 1 (tylko Wikipedia; dla Reddita puste)
  - name: consensus_stance
    description: supports, challenges, neutral albo not_applicable (tylko Reddit, w arkuszu stanowiska `stance_*.xlsx`; R14)
  - name: consensus_topic
    description: climate, vaccines, evolution, gmo, fluoride albo none (tylko Reddit, w arkuszu walidacyjnym H1 v2; R15)
  - name: uncertain
    description: 1, jeśli etykieta budzi wątpliwości (R12); w przeciwnym razie 0
  - name: notes
    description: uzasadnienie wątpliwości, numer reguły, propozycja zmiany codebooka

changelog:
  - version: "1.0"
    date: 2026-10-16
    changes: >-
      Pierwsza wersja. Zastępuje dwa niezgodne schematy instrumentu v1
      (Reddit: 7 kategorii plus „link/domena” i „sygnał powołania”;
      Wikipedia: 6 kategorii plus 3 kategorie pomocnicze) jednym zestawem
      10 kategorii. Dodaje definicje, kryteria wykluczenia, przykłady z danych
      i reguły rozstrzygania. Wydziela zmienną `edit_about_sources` dla
      Wikipedii.
  - version: "2.0"
    date: 2026-10-18
    changes: >-
      Kategorie i kody zgodne ze slajdem „Codebook”: dziewięć angielskich
      kodów (`scientific`, `institutional`, `media`, `personal`,
      `social_blog`, `encyclopedia`, `other`, `unknown`, `none`) zamiast
      dziesięciu polskich. `nauka` dzieli się na `scientific` (publikacje) i
      `institutional` (uczelnie, instytuty, sondażownie); `oficjalne` na
      `institutional` (instytucje statystyczne i zdrowia publicznego) i
      `other` (urzędy, administracja, prawo). `komercyjne`, `organizacje` i
      `inne` łączą się w `other`, z wyjątkiem blogów, które trafiają do
      `social_blog`. Nowy kod `none` zastępuje puste `source_types`, a
      `cites_source` jest wyliczane z `source_types` (R13).
  - version: "2.1"
    date: 2026-10-24
    changes: >-
      Nowa zmienna `consensus_stance` (stanowisko wobec konsensusu naukowego:
      `supports`, `challenges`, `neutral`, `not_applicable`) dla postów z
      Reddita, kodowana w osobnym arkuszu stanowiska, do weryfikacji hipotezy
      o spadku zaufania do konsensusu naukowego w latach 2005–2018 (R14).
      Kategorie i zmienne z wersji 2.0 bez zmian.
  - version: "2.2"
    date: 2026-10-25
    changes: >-
      Nowa zmienna `consensus_topic` (temat konsensusu naukowego: `climate`,
      `vaccines`, `evolution`, `gmo`, `fluoride`, `none`) dla postów i
      komentarzy z Reddita, kodowana razem z `consensus_stance` w arkuszu
      walidacyjnym rozszerzonego testu H1 (R15). Stanowisko oceniamy względem
      konsensusu danego tematu. Pozostałe zmienne bez zmian.
