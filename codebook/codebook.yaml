# Codebook: powoływanie się na źródła informacji (Reddit i Wikipedia).
# Jedno źródło prawdy dla annotatorów i instrumentów. Czytelną wersję
# codebook/codebook.md generuje `make codebook`; nie edytuj jej ręcznie.

title: Powoływanie się na źródła informacji
version: "1.0"
date: 2026-10-16
status: wersja robocza przed pilotażem annotacji

construct: >-
  Powołanie się na źródło to wskazanie przez autora, skąd pochodzi
  informacja albo na czym opiera on twierdzenie: link, nazwa źródła,
  ogólnikowe odwołanie („badania pokazują”) albo jawnie przywołane
  doświadczenie własne lub cudze. Kodujemy typ źródła, nie jego wiarygodność
  ani to, czy autor z nim się zgadza.

units:
  - platform: reddit
    unit: post
    text: tytuł, treść i link posta (kolumny `title`, `text` i `url`)
    note: >-
      Pole `url` liczy się tylko wtedy, gdy prowadzi poza własny wątek
      posta (post z linkiem). Komentarzy pod postem nie ma w danych. Nie
      otwieramy linków: kategorię ustalamy z domeny i otaczającego tekstu.
  - platform: wikipedia
    unit: opis zmiany jednej rewizji
    text: pole `comment` rewizji
    note: >-
      To krótki opis edycji wpisany przez redaktora albo wygenerowany przez
      narzędzie, a nie treść artykułu ani strona dyskusji.

variables:
  - code: cites_source
    name: Powołanie się na źródło
    type: binary
    platforms: [reddit, wikipedia]
    question: Czy autor wskazuje, skąd pochodzi informacja lub na czym opiera twierdzenie?
    values:
      "1": jest co najmniej jedno powołanie zgodne z definicją konstruktu i regułami
      "0": brak powołania, także gdy występują tylko linki lub nazwy niebędące źródłem (R2, R3, R8, R9)
  - code: source_types
    name: Typy źródeł
    type: multilabel
    platforms: [reddit, wikipedia]
    question: Jakiego typu źródła przywołuje autor? Zaznacz wszystkie występujące.
    requires: cites_source = 1; przy cites_source = 0 pole zostaje puste
  - code: edit_about_sources
    name: Edycja dotyczy źródeł lub przypisów
    type: binary
    platforms: [wikipedia]
    question: Czy opis zmiany deklaruje dodanie, usunięcie, wymianę lub poprawę źródeł albo przypisów?
    values:
      "1": opis deklaruje pracę nad źródłami lub przypisami (w tym znacznik „źródła/przypisy”)
      "0": brak takiej deklaracji; sam prefiks sekcji `/* Przypisy */` się nie liczy (R9)

categories:
  - code: media
    name: Media informacyjne i publicystyczne
    definition: Portale, gazety, telewizja, radio, agencje prasowe i magazyny publicystyczne.
    include:
      - link do artykułu lub materiału redakcji (wp.pl, onet.pl, gazeta.pl, money.pl, krytykapolityczna.pl, bbc.com)
      - nazwa redakcji jako źródła („jak podaje TVN24”)
      - porady językowe publikowane w prasie
    exclude:
      - media jako temat lub uczestnik zdarzenia („TVP zwolniła dziennikarza”)
      - konto redakcji w serwisie społecznościowym bez linku do materiału redakcji (wtedy `platformy`)
    positive:
      - platform: reddit
        text: Tytuł artykułu o wecie prezydenta i link do wiadomosci.gazeta.pl jako cała treść posta.
      - platform: wikipedia
        text: Poprawa błędu językowego, „por. np.” i link do felietonu w gazetawroclawska.pl.
    negative:
      - platform: reddit
        text: Post o tym, że ZUS konfiskuje oszczędności, z linkiem do wp.pl.
        why: To jest `media`, a nie `oficjalne`. ZUS i ministerstwo są bohaterami tekstu, a wydawcą jest wp.pl (R4).

  - code: oficjalne
    name: Instytucje publiczne i oficjalne
    definition: Organy władzy i administracji, urzędy, agencje rządowe i samorządowe, organizacje międzynarodowe (WHO, ECDC) oraz dokumenty urzędowe.
    include:
      - link do domen gov.pl, who.int, ecdc.europa.eu, aids.gov.pl
      - „według GUS”, „dane NFZ”, „komunikat policji”, treść ustawy
    exclude:
      - instytucja jako uczestnik zdarzenia („policja lata i pilnuje kibiców”, „Sejm uchwalił ustawę”)
      - kontakt z urzędem opisany jako własne przeżycie (wtedy `osobiste`)
    positive:
      - platform: wikipedia
        text: Usunięcie synonimów, bo „według tego źródła” nimi nie są, z linkiem do aids.gov.pl.
      - platform: wikipedia
        text: Objawy uzupełnione „według WHO”, z linkiem do strony pytań i odpowiedzi WHO.
    negative:
      - platform: reddit
        text: Zbiórka pomocy w odnalezieniu bliskiej osoby; w tekście słowo „bogusiem”.
        why: Nie ma żadnej instytucji. Ciąg „gus” jest tylko fragmentem imienia.

  - code: nauka
    name: Nauka, badania i dane
    definition: Publikacje naukowe, uczelnie i instytuty, raporty badawcze, sondaże i zbiory danych ośrodków badawczych, biblioteki cyfrowe.
    include:
      - doi.org, pubmed, nature.com, repozytoria publikacji (academia.edu), biblioteki cyfrowe
      - nazwany sondaż lub ośrodek badawczy („sondaż IBRiS”), tabela wyników sondaży
      - „źródło uniwersyteckie” w opisie edycji
    exclude:
      - własne badanie autora, np. rekrutacja do ankiety (R8)
      - osobista wizyta u lekarza (wtedy `osobiste`)
      - ogólnik bez wskazania badania („badania pokazują”; wtedy `niesprecyzowane`)
    positive:
      - platform: reddit
        text: Tabela ostatnich sondaży partyjnych z nazwami sondażowni, terminami i wielkością próby.
      - platform: wikipedia
        text: Cytat z publikacji o wprowadzeniu do medycyny wraz z linkiem do PDF w bibliotece cyfrowej.
    negative:
      - platform: reddit
        text: Studentka zbiera odpowiedzi do ankiety do pracy dyplomowej i podaje link do formularza.
        why: To własne badanie autorki, nie powołanie się na badania (R8).
      - platform: reddit
        text: Opis wielu lat problemów zdrowotnych; „ostatni lekarz umocnił moje przypuszczenia”.
        why: To relacja z osobistej konsultacji, więc `osobiste`, a nie publikacja czy instytucja badawcza.

  - code: encyklopedie
    name: Encyklopedie, słowniki i bazy wiedzy
    definition: Encyklopedie (w tym artykuły Wikipedii), słowniki, poradnie językowe słowników i bazy wiedzy.
    include:
      - link do artykułu Wikipedii, Wikidata, IMDb
      - sjp.pwn.pl i poradnia językowa PWN
      - linki objaśniające nazwy, np. nazwa partii podlinkowana do Wikipedii
    exclude:
      - skróty zasad i narzędzi Wikipedii w opisach edycji (`[[WP:SK]]`, `[[WP:POP]]`, `[[Pomoc:…]]`; R9)
    positive:
      - platform: wikipedia
        text: „Brzydki rusycyzm” i link do poradni językowej sjp.pwn.pl.
      - platform: reddit
        text: Nazwy partii w tabeli sondaży podlinkowane do artykułów angielskiej Wikipedii.
    negative:
      - platform: wikipedia
        text: "`[[WP:SK]], drobne techniczne`"
        why: To odnośnik do narzędzia porządkowania kodu (skrypt WP:SK), a nie źródło informacji (R9).

  - code: platformy
    name: Media społecznościowe i platformy treści użytkowników
    definition: YouTube, Facebook, X/Twitter, TikTok, Instagram, Wykop, Reddit, fora i podobne serwisy.
    include:
      - link do filmu, wpisu lub wątku udostępnionego jako informacja
      - „widziałem na Twitterze, że…”, wpis polityka w serwisie społecznościowym
    exclude:
      - zdjęcia i filmy autora hostowane przez platformę (i.redd.it, preview.redd.it, v.redd.it, imgur; R3)
      - nazwa serwisu w innym znaczeniu, np. kod rabatowy „reddit100”
    positive:
      - platform: reddit
        text: Post z okazji rocznicy zaprzysiężenia prezydenta z linkiem do filmu na YouTube jako materiałem do dyskusji.
    negative:
      - platform: reddit
        text: Reklama perfumerii, której treścią jest tylko zdjęcie z preview.redd.it.
        why: Zdjęcie jest własną treścią autora, a nie źródłem (R3).

  - code: komercyjne
    name: Źródła komercyjne
    definition: Sklepy, producenci, serwisy ogłoszeniowe i rezerwacyjne oraz strony firm użyte jako źródło informacji (cena, specyfikacja, opinie).
    include:
      - „według strony producenta rama waży 1,2 kg”
      - link do oferty jako dowód ceny lub dostępności
    exclude:
      - serwis jako miejsce poszukiwań lub przedmiot pytania („poza OLX i Otodom szukam innych stron”; R2)
      - reklama, link afiliacyjny, spam, kod rabatowy (R3)
      - sklep jako miejsce zdarzenia („sklepy zamykały rolety”)
    positive:
      - platform: reddit
        text: "Konstruowany: „Na Allegro ten model kosztuje 300 zł, więc 500 zł to przesada” z linkiem do oferty."
    negative:
      - platform: reddit
        text: Pytanie po angielsku, czy poza OLX i Otodom są inne serwisy z mieszkaniami na krótki termin.
        why: Serwisy są przedmiotem pytania, a nie źródłem informacji (R2).
      - platform: reddit
        text: Post kasyna online o bonusie powitalnym; link posta prowadzi do serwisu z promocjami hazardowymi.
        why: Reklama lub spam (R3).

  - code: organizacje
    name: Organizacje pozarządowe, społeczne i polityczne
    definition: Fundacje, stowarzyszenia, NGO, związki zawodowe i partie polityczne jako wydawcy informacji.
    include:
      - link do strony fundacji lub NGO (wwf.pl, greenpeace.org)
      - „raport fundacji X”, stanowisko partii opublikowane na jej stronie
    exclude:
      - organizacja jako temat lub uczestnik zdarzenia
      - polityk pełniący funkcję państwową, który mówi w imieniu urzędu (wtedy `oficjalne`)
    positive:
      - platform: wikipedia
        text: Link do strony WWF o klimacie z dopiskiem „inspiracja”.
    negative:
      - platform: reddit
        text: Post o rozłamie w partii z linkiem do artykułu wprost.pl.
        why: Partia jest tematem, a wydawcą jest medium, więc `media` (R4).

  - code: osobiste
    name: Doświadczenie własne i relacje z drugiej ręki
    definition: Autor opiera twierdzenie na własnym doświadczeniu albo na relacji konkretnej osoby z otoczenia, w tym specjalisty spotkanego osobiście.
    include:
      - „z własnego doświadczenia”, „u mnie w pracy zawsze…” użyte jako dowód twierdzenia
      - „znajomy pracuje w szpitalu i mówi, że…”, „lekarz powiedział mi, że…”
    exclude:
      - opis sytuacji bez funkcji dowodu („mieszkam w centrum, można odebrać”)
      - osoby jako uczestnicy, np. szukanie znajomych czy prezent dla znajomego
      - własna opinia („według mnie”, „moim zdaniem”; R8)
    positive:
      - platform: reddit
        text: Opis wielu lat problemów zdrowotnych; „ostatni lekarz umocnił moje przypuszczenia”.
    negative:
      - platform: reddit
        text: Para szuka znajomych do wspólnego wychodzenia.
        why: „znajomych” to cel posta, a nie źródło informacji.
      - platform: reddit
        text: „Mieszkam na wsi” i pytanie o lepszego dostawcę internetu.
        why: Miejsce zamieszkania jest kontekstem, a nie dowodem.

  - code: niesprecyzowane
    name: Ogólnikowe powołanie bez wskazania źródła
    definition: Autor odwołuje się do źródła, którego nie da się zidentyfikować („badania pokazują”, „czytałem gdzieś”, „według ekspertów”, „wg źródła”).
    include:
      - „takie badania zostały przeprowadzone” bez wskazania których
      - „wg źródła” w opisie edycji bez nazwy lub linku
    exclude:
      - sam znacznik „źródła/przypisy” lub „dodano przypis” w opisie edycji (to `edit_about_sources`; R10)
      - słowo „link” lub „artykuł” w innym znaczeniu („podeślijcie link partnerkom”, „poprawiam link”)
      - własna opinia („według mnie”; R8)
    positive:
      - platform: wikipedia
        text: Uwaga, że takie badania przeprowadzono, a korzyści leku są dyskusyjne; bez wskazania badań.
      - platform: wikipedia
        text: "„wg źródła jeszcze kapusta”"
    negative:
      - platform: wikipedia
        text: "„drobne redakcyjne, źródła/przypisy”"
        why: To znacznik typu edycji, a nie powołanie, więc edit_about_sources = 1 i cites_source = 0 (R10).
      - platform: wikipedia
        text: "Bot: „poprawiam link tożsamy z tekstem linka”"
        why: Słowo „link” oznacza tu element techniczny strony.

  - code: inne
    name: Inne zidentyfikowane źródło
    definition: Źródło dające się zidentyfikować (nazwa lub link), które nie pasuje do żadnej z powyższych kategorii, np. prywatny blog.
    include:
      - link do prywatnego bloga lub strony hobbystycznej użytej jako źródło informacji
    exclude:
      - źródło pasujące do innej kategorii; `inne` stosujemy tylko w ostateczności
      - strona będąca przedmiotem rozmowy, np. aplikacja polecana w poście (R2)
    positive:
      - platform: reddit
        text: "Konstruowany: „Trasę opisał autor bloga rowerowego X, tam są też wysokości przewyższeń” z linkiem do bloga."
    negative:
      - platform: reddit
        text: Pytanie o aplikacje do „zbierania kwadratów” z linkami do ich stron głównych.
        why: Linki wskazują przedmiot rozmowy, a nie źródło informacji (R2).

rules:
  - code: R1
    text: >-
      Etykietujemy całą jednostkę: post (tytuł, treść i link) albo opis zmiany.
      Przy `source_types` zaznacz każdą kategorię, która wystąpiła choć raz;
      liczba wystąpień nie ma znaczenia.
  - code: R2
    text: >-
      Powołanie wymaga funkcji źródła: tekst lub link musi wskazywać, skąd
      pochodzi informacja, albo podawać ją jako podstawę twierdzenia. Sama
      wzmianka o instytucji, osobie lub serwisie jako uczestniku zdarzenia
      albo przedmiocie rozmowy to nie powołanie.
  - code: R3
    text: >-
      Nie są źródłem: własne zdjęcia i filmy hostowane przez platformę
      (i.redd.it, preview.redd.it, v.redd.it, imgur), formularze ankiet,
      reklamy, linki afiliacyjne, spam, kody rabatowe i linki do profili
      użytkowników.
  - code: R4
    text: >-
      Kategorię wyznacza wydawca lub kanał, z którego pochodzi informacja,
      a nie temat ani osoby opisane w materiale. Artykuł wp.pl o decyzji
      ministerstwa to `media`. Gdy autor wymienia też źródło pierwotne
      przywołane w materiale („onet, powołując się na raport NIK”),
      zaznacz obie kategorie.
  - code: R5
    text: >-
      Konkret wygrywa z ogólnikiem. `niesprecyzowane` zaznaczamy tylko
      wtedy, gdy jakieś odwołanie w jednostce pozostaje nierozpoznawalne.
      Jeśli ten sam fragment wskazuje konkretne źródło, kodujemy jego
      kategorię.
  - code: R6
    text: >-
      Nie oceniamy wiarygodności. Tekst pseudonaukowy w repozytorium
      publikacji to nadal `nauka`, a artykuł z portalu o niskiej
      wiarygodności to nadal `media`.
  - code: R7
    text: >-
      Kategoria `inne` jest ostatecznością. Gdy domena jest nieznana, można
      sprawdzić, kto ją prowadzi, ale nie kodujemy treści strony docelowej.
  - code: R8
    text: >-
      Nie są powołaniem: własna opinia („według mnie”, „moim zdaniem”),
      prośba o źródło („macie jakieś dane?”) ani własne badanie autora
      (rekrutacja do ankiety).
  - code: R9
    text: >-
      Wikipedia, elementy techniczne. Pomijamy automatyczny prefiks sekcji
      `/* … */`. Skróty zasad i narzędzi (`[[WP:…]]`, `[[Pomoc:…]]`), opisy
      redakcyjne („drobne redakcyjne”, „int.”, „kat.”), komunikaty botów i
      rewerty („Wycofano edycje użytkownika…”, „Anulowanie wersji…”) nie są
      źródłem.
  - code: R10
    text: >-
      Wikipedia, praca nad przypisami. Deklaracja pracy nad źródłami
      (znacznik „źródła/przypisy”, „dodano przypis”, poprawa przypisów) daje
      `edit_about_sources = 1`. `cites_source = 1` dajemy tylko wtedy, gdy
      opis identyfikuje źródło albo jego typ („wg WHO”, „źródło
      uniwersyteckie”).
  - code: R11
    text: Wpisy po angielsku i w innych językach kodujemy według tych samych reguł.
  - code: R12
    text: >-
      W razie wątpliwości wybierz najlepszą etykietę, ustaw `uncertain = 1`
      i opisz problem w `notes`. Takie przypadki omawiamy przy uzgadnianiu
      etykiet i mogą one zmienić codebook.

annotation_columns:
  - name: unit_id
    description: identyfikator jednostki (Reddit `id` posta; Wikipedia `strona#numer_rewizji`)
  - name: annotator
    description: inicjały osoby annotującej
  - name: cites_source
    description: 0 lub 1
  - name: source_types
    description: kody kategorii rozdzielone średnikiem, np. `media;nauka`; puste przy cites_source = 0
  - name: edit_about_sources
    description: 0 lub 1 (tylko Wikipedia; dla Reddita puste)
  - name: uncertain
    description: 1, jeśli etykieta budzi wątpliwości (R12); w przeciwnym razie 0
  - name: notes
    description: uzasadnienie wątpliwości, numer reguły, propozycja zmiany codebooka

changelog:
  - version: "1.0"
    date: 2026-10-16
    changes: >-
      Pierwsza wersja. Zastępuje dwa niezgodne schematy instrumentu v1
      (Reddit: 7 kategorii plus „link/domena” i „sygnał powołania”;
      Wikipedia: 6 kategorii plus 3 kategorie pomocnicze) jednym zestawem
      10 kategorii. Dodaje definicje, kryteria wykluczenia, przykłady z danych
      i reguły rozstrzygania. Wydziela zmienną `edit_about_sources` dla
      Wikipedii.
