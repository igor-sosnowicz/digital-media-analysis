[project]
name = "digital-media-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "igor-sosnowicz", email = "igor@sosnowicz.eu" }
]
requires-python = ">=3.13"
dependencies = [
    "convokit>=4.1.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "tqdm>=4.70.1",
]

[project.scripts]
digital-media-analysis = "digital_media_analysis:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
]
ml = [
    "gliner>=0.2.16",
    "protobuf>=5",
    "sentencepiece>=0.2",
    "torch>=2.7",
    "transformers>=4.46",
]
